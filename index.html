<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
                <title id="page-title">Loading...</title>
                <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
                    <script src="config.js"></script>
                    <style>
                        :root {
                            --bg: #FDF6EE;
                            --surface: #FFFCF8;
                            --surface2: #F2E8DA;
                            --border: #E0D0BC;
                            --text: #2A1F14;
                            --text-muted: #7A6555;
                            --accent: #9B3A1A;
                            --accent-light: #F5E6DF;
                            --accent2: #3A6B3A;
                            --accent2-light: #DFF0DF;
                            --mono: 'DM Mono', monospace;
                            --serif: 'DM Serif Display', serif;
                            --sans: 'DM Sans', sans-serif;
                        }
                        * { box-sizing: border-box; margin: 0; padding: 0; }
                        body { font-family: var(--sans); background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
                        
                        header { background: var(--text); color: var(--bg); padding: 0 24px; display: flex; align-items: center; height: 60px; position: sticky; top: 0; z-index: 100; gap: 10px; }
                        .logo { font-family: var(--serif); font-size: 1.25rem; letter-spacing: 0.02em; color: var(--bg); }
                        .logo span { color: #D4845A; }
                        .logo-sub { font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: #A08878; margin-top: 2px; }
                        
                        nav { background: var(--surface); border-bottom: 1px solid var(--border); display: flex; overflow-x: auto; scrollbar-width: none; position: sticky; top: 60px; z-index: 99; }
                        nav::-webkit-scrollbar { display: none; }
                        .nav-btn { flex-shrink: 0; padding: 14px 20px; font-family: var(--sans); font-size: 0.8rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); background: none; border: none; border-bottom: 2px solid transparent; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
                        .nav-btn:hover { color: var(--text); }
                        .nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
                        
                        main { flex: 1; padding: 24px 16px; max-width: 900px; margin: 0 auto; width: 100%; }
                        .view { display: none; }
                        .view.active { display: block; }
                        
                        .view-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
                        .view-title { font-family: var(--serif); font-size: 1.8rem; color: var(--text); }
                        
                        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 6px; font-family: var(--sans); font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all 0.15s; border: none; }
                        .btn-primary { background: var(--accent); color: white; }
                        .btn-primary:hover { background: #7A2D14; }
                        .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
                        .btn-secondary:hover { background: var(--border); }
                        .btn-ghost { background: none; color: var(--text-muted); padding: 6px 10px; border: none; cursor: pointer; border-radius: 6px; font-size: 0.85rem; font-family: var(--sans); font-weight: 500; }
                        .btn-ghost:hover { color: var(--accent); background: var(--accent-light); }
                        .btn-danger { background: none; color: #B03030; padding: 6px 10px; border: none; cursor: pointer; border-radius: 6px; font-size: 0.85rem; font-family: var(--sans); }
                        .btn-danger:hover { background: #FDE8E8; }
                        .btn-sm { padding: 6px 12px; font-size: 0.78rem; }
                        
                        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; transition: box-shadow 0.15s; }
                        .card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
                        .card-top { display: flex; align-items: center; padding: 14px 16px; gap: 10px; }
                        .card-info { flex: 1; min-width: 0; cursor: pointer; }
                        .card-title { font-weight: 600; font-size: 0.95rem; }
                        .card-sub { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; font-family: var(--mono); }
                        .card-actions { display: flex; gap: 4px; flex-shrink: 0; align-items: center; }
                        .card-body { display: none; padding: 12px 16px 14px; border-top: 1px solid var(--surface2); }
                        .card-body.open { display: block; }
                        .caret { font-size: 0.7rem; color: var(--text-muted); transition: transform 0.2s; display: inline-block; cursor: pointer; padding: 6px; }
                        .caret.open { transform: rotate(90deg); }
                        
                        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
                        @media (min-width: 640px) { .menu-grid { grid-template-columns: 1fr 1fr; } }
                        .menu-tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; cursor: pointer; transition: box-shadow 0.15s, border-color 0.15s; }
                        .menu-tile:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); border-color: #C8A898; }
                        .menu-tile-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
                        .menu-tile-name { font-family: var(--serif); font-size: 1.15rem; color: var(--text); line-height: 1.2; }
                        .menu-tile-arrow { color: var(--text-muted); font-size: 1rem; margin-top: 2px; }
                        .menu-tile-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
                        .menu-stat { background: var(--surface2); border-radius: 8px; padding: 10px 12px; }
                        .menu-stat-val { font-family: var(--serif); font-size: 1.15rem; color: var(--accent); }
                        .menu-stat-lbl { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); margin-top: 2px; }
                        .menu-tile-recipes { font-size: 0.75rem; color: var(--text-muted); margin-top: 10px; }
                        
                        .detail-back { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
                        .detail-title { font-family: var(--serif); font-size: 1.8rem; color: var(--text); }
                        .detail-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 20px; }
                        .detail-stat { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
                        .detail-stat-val { font-family: var(--serif); font-size: 1.5rem; color: var(--accent); }
                        .detail-stat-lbl { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); margin-top: 2px; }
                        .detail-actions { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
                        
                        .estimator-back { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
                        .estimator-menu-name { font-family: var(--serif); font-size: 1.6rem; color: var(--text); }
                        
                        .form-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
                        .form-panel h3 { font-family: var(--serif); font-size: 1.1rem; margin-bottom: 16px; color: var(--text); }
                        .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
                        .form-group { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 120px; }
                        .form-group label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); }
                        input, select, textarea { font-family: var(--sans); font-size: 0.88rem; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); outline: none; transition: border-color 0.15s; width: 100%; }
                        input:focus, select:focus, textarea:focus { border-color: var(--accent); background: white; }
                        textarea { resize: vertical; min-height: 70px; }
                        
                        .ing-row { display: flex; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--surface2); }
                        .ing-row:last-child { border-bottom: none; }
                        .section-label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); }
                        
                        .est-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
                        .est-table th { text-align: left; padding: 8px 10px; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); background: var(--surface2); border-bottom: 1px solid var(--border); }
                        .est-table td { padding: 10px 10px; border-bottom: 1px solid var(--surface2); vertical-align: middle; }
                        .est-table tr:last-child td { border-bottom: none; }
                        .est-table .num { font-family: var(--mono); text-align: right; font-size: 0.83rem; }
                        .est-table tfoot td { font-weight: 600; background: var(--surface2); border-top: 2px solid var(--border); }
                        .qty-input { width: 65px; text-align: center; font-family: var(--mono); font-size: 0.88rem; padding: 5px 6px; }
                        .cost-better { color: var(--accent2); font-weight: 600; }
                        .sweet-spot { font-size: 0.75rem; margin-top: 4px; padding: 3px 8px; border-radius: 4px; display: inline-block; }
                        .sweet-spot.hint { background: #FFF4E0; color: #8B5C00; border: 1px solid #F0D080; }
                        .sweet-spot.optimal { background: var(--accent2-light); color: var(--accent2); border: 1px solid #A8D8A8; }
                        
                        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
                        .summary-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; }
                        .summary-box .val { font-family: var(--serif); font-size: 1.5rem; color: var(--accent); }
                        .summary-box .lbl { font-size: 0.7rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); margin-top: 4px; }
                        
                        .menu-selector { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
                        .menu-selector label { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); }
                        .menu-selector select { max-width: 260px; flex: 1; }
                        .shop-item { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid var(--surface2); font-size: 0.88rem; }
                        .shop-item:last-child { border-bottom: none; }
                        .shop-qty { font-family: var(--mono); font-size: 0.82rem; color: var(--accent); font-weight: 500; white-space: nowrap; margin-left: 12px; }
                        
                        .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
                        .add-row-btn { margin-top: 10px; }
                        .menu-card { padding: 16px; }
                        .menu-rec-row { display: grid; grid-template-columns: minmax(0,1fr) 64px 84px 30px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--surface2); }
                        .menu-rec-row:last-child { border-bottom: none; }
                        .menu-rec-head { font-size: 0.68rem; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-muted); padding-top: 0; border-bottom: 1px solid var(--border); }
                        .menu-rec-head span:nth-child(2), .menu-rec-head span:nth-child(3) { text-align: right; }
                        .menu-rec-name { font-size: 0.9rem; font-weight: 500; }
                        .menu-rec-row .qty-input { width: 100%; justify-self: end; }
                        .menu-rec-cost { font-family: var(--mono); font-size: 0.82rem; text-align: right; color: var(--text-muted); }
                        .menu-rec-picker { grid-column: 1 / 4; }
                        .menu-empty { font-size: 0.85rem; color: var(--text-muted); padding: 10px 0; }
                        .form-actions { display: flex; gap: 8px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
                        .form-actions .form-delete { margin-left: auto; }
                        .currency-input { position: relative; }
                        .currency-input span { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.88rem; pointer-events: none; }
                        .currency-input input { padding-left: 22px; }
                        .rec-ing-row { display: grid; grid-template-columns: minmax(0,3fr) 90px minmax(60px,1.5fr) 30px; gap: 8px; align-items: center; }
                        .ing-uom-label { font-size: 0.8rem; color: var(--text-muted); font-family: var(--mono); min-width: 0; overflow-wrap: anywhere; line-height: 1.3; }
                        @media (max-width: 600px) {
                            .rec-ing-row { grid-template-columns: 90px minmax(0,1fr) 30px; row-gap: 6px; padding: 10px 0; }
                            .rec-ing-row select { grid-column: 1 / -1; }
                        }
                        .card-clickable { cursor: pointer; }
                        .card-chevron { color: var(--text-muted); font-size: 1.2rem; padding: 0 4px; flex-shrink: 0; }
                        select.placeholder { color: var(--text-muted); }
                        .help-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-bottom: 14px; line-height: 1.55; font-size: 0.9rem; }
                        .help-card h2 { font-family: var(--serif); font-weight: normal; font-size: 1.25rem; color: var(--accent); margin-bottom: 8px; }
                        .help-card p { margin-bottom: 8px; }
                        .help-card p:last-child, .help-card ul:last-child, .help-card ol:last-child { margin-bottom: 0; }
                        .help-card ul, .help-card ol { padding-left: 20px; margin-bottom: 8px; }
                        .help-card li { margin-bottom: 4px; }
                        .help-example { background: var(--surface2); border-radius: 8px; padding: 10px 14px; margin: 10px 0; font-family: var(--mono); font-size: 0.8rem; line-height: 1.7; }
                        .help-tip { color: var(--text-muted); font-size: 0.84rem; }
                        .help-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
                        .help-compare > div { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
                        .help-compare h3 { font-size: 0.95rem; color: var(--accent); margin-bottom: 4px; }
                        .help-compare p { margin-bottom: 6px; }
                        @media (max-width: 420px) { .help-compare { grid-template-columns: 1fr; } }
                        .empty { text-align: center; padding: 48px 24px; color: var(--text-muted); }
                        .empty-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.4; }
                        .empty p { font-size: 0.88rem; margin-top: 6px; }
                        .divider { height: 1px; background: var(--border); margin: 16px 0; }
                        
                        .storage-bar { background: var(--surface2); border-bottom: 1px solid var(--border); padding: 8px 16px; font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
                        .storage-bar strong { color: var(--accent2); }
                        
                        @media (max-width: 500px) {
                            .view-title, .detail-title { font-size: 1.4rem; }
                            .summary-box .val { font-size: 1.2rem; }
                            .est-table th, .est-table td { padding: 7px 5px; font-size: 0.75rem; }
                            .qty-input { width: 52px; }
                        }
                    </style>
    </head>
    <body>
        
        <header>
            <div>
                <div class="logo" id="header-logo"></div>
                <div class="logo-sub" id="header-tagline"></div>
            </div>
        </header>
        
        <div class="storage-bar">
            <span>💾 <strong>Auto-saving</strong> to this browser</span>
            <span style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end">
                <button class="btn-ghost btn-sm" onclick="exportData()" style="font-size:0.72rem;padding:3px 8px;">Back up</button>
                <button class="btn-ghost btn-sm" onclick="document.getElementById('import-file').click()" style="font-size:0.72rem;padding:3px 8px;">Restore</button>
                <button class="btn-ghost btn-sm" onclick="clearAllData()" style="font-size:0.72rem;padding:3px 8px;">Reset to defaults</button>
            </span>
            <input type="file" id="import-file" accept=".json,application/json" style="display:none" onchange="importData(this)">
        </div>
        
        <nav>
            <button class="nav-btn active" onclick="showView('menus', this)">Menus</button>
            <button class="nav-btn" onclick="showView('recipes', this)">Recipes</button>
            <button class="nav-btn" onclick="showView('ingredients', this)">Ingredients</button>
            <button class="nav-btn" onclick="showView('shopping', this)">Shopping List</button>
            <button class="nav-btn" onclick="showView('help', this)">Help</button>
        </nav>
        
        <main>
            
            <!-- MENUS -->
            <div id="view-menus" class="view active">
                <div id="screen-grid">
                    <div class="view-header">
                        <div class="view-title">Menus</div>
                        <button class="btn btn-primary" onclick="showNewMenuForm()">+ New Menu</button>
                    </div>
                    <div class="form-panel" id="newMenuForm" style="display:none">
                        <h3>New Menu</h3>
                        <div class="form-row">
                            <div class="form-group" style="flex:3"><label>Menu Name</label><input id="new-menu-name" type="text" placeholder="e.g. Saturday Farmers Market"></div>
                        </div>
                        <div class="divider"></div>
                        <div class="section-label" style="margin-bottom:10px">Recipes</div>
                        <div id="newMenuRecipeRows"></div>
                        <button class="btn btn-secondary btn-sm add-row-btn" onclick="addNewMenuRecipeRow()">+ Add Recipe</button>
                        <div style="display:flex;gap:8px;margin-top:16px">
                            <button class="btn btn-primary" onclick="saveNewMenu()">Save Menu</button>
                            <button class="btn btn-secondary" onclick="hideNewMenuForm()">Cancel</button>
                        </div>
                    </div>
                    <div id="menuGrid"></div>
                </div>
                
                <div id="screen-detail" style="display:none">
                    <div class="detail-back">
                        <button class="btn btn-secondary btn-sm" onclick="showGrid()">← Menus</button>
                        <div class="detail-title" id="detail-title"></div>
                    </div>
                    <div class="detail-stats" id="detail-stats"></div>
                    <div class="detail-actions">
                        <button class="btn btn-primary" onclick="openEstimator()">Open Estimator</button>
                        <button class="btn-danger" onclick="deleteCurrentMenu()">Delete</button>
                    </div>
                    <div class="card menu-card">
                        <div class="form-group"><label>Menu Name</label><input id="detail-menu-name" type="text" onchange="renameCurrentMenu(this)"></div>
                        <div class="divider"></div>
                        <div class="menu-rec-row menu-rec-head"><span>Recipe</span><span>Batches</span><span>Purchase / batch</span><span></span></div>
                        <div id="detail-recipe-list"></div>
                        <button class="btn btn-secondary btn-sm add-row-btn" onclick="addMenuRecipePicker()">+ Add Recipe</button>
                    </div>
                </div>
                
                <div id="screen-estimator" style="display:none">
                    <div class="estimator-back">
                        <button class="btn btn-secondary btn-sm" onclick="closeEstimator()">← Menu</button>
                        <div class="estimator-menu-name" id="estimator-title"></div>
                    </div>
                    <div id="estimatorContent"></div>
                </div>
            </div>
            
            <!-- RECIPES -->
            <div id="view-recipes" class="view">
                <div class="view-header">
                    <div class="view-title">Recipes</div>
                    <button class="btn btn-primary" onclick="openRecipeForm()">+ Add Recipe</button>
                </div>
                <div class="form-panel" id="recipeForm" style="display:none">
                    <h3 id="recFormTitle">New Recipe</h3>
                    <input type="hidden" id="rec-edit-id">
                        <div class="form-row">
                            <div class="form-group" style="flex:3"><label>Recipe Name</label><input id="rec-name" type="text" placeholder="e.g. Chocolate Chip Cookies"></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>Description (optional)</label><textarea id="rec-desc" placeholder="Brief description or yield..."></textarea></div>
                        </div>
                        <div class="divider"></div>
                        <div class="section-label" style="margin-bottom:10px">Ingredients</div>
                        <div id="recIngRows"></div>
                        <button class="btn btn-secondary btn-sm add-row-btn" onclick="addIngRow()">+ Add Ingredient</button>
                        <div class="form-actions">
                            <button class="btn btn-primary" onclick="saveRecipe()">Save Recipe</button>
                            <button class="btn btn-secondary" onclick="closeRecipeForm()">Cancel</button>
                            <button class="btn-danger form-delete" id="rec-delete-btn" onclick="deleteRecipe()">Delete Recipe</button>
                        </div>
                </div>
                <div id="recipeList"></div>
            </div>
            
            
            <!-- INGREDIENTS -->
            <div id="view-ingredients" class="view">
                <div class="view-header">
                    <div class="view-title">Ingredients</div>
                    <button class="btn btn-primary" onclick="openIngForm()">+ Add Ingredient</button>
                </div>
                <div class="form-panel" id="ingForm" style="display:none">
                    <h3 id="ingFormTitle">New Ingredient</h3>
                    <input type="hidden" id="ing-edit-id">
                        <div class="form-row">
                            <div class="form-group" style="flex:3"><label>Name</label><input id="ing-name" type="text" placeholder="e.g. All-Purpose Flour"></div>
                            <div class="form-group" style="flex:2"><label>Unit of Measure</label><input id="ing-uom" type="text" placeholder="e.g. cup, tsp, oz"></div>
                        </div>
                        <div class="form-row">
                            <div class="form-group"><label>Package Size</label><input id="ing-size" type="number" placeholder="e.g. 18.9" min="0" step="any"></div>
                            <div class="form-group"><label>Package Price</label><div class="currency-input"><span>$</span><input id="ing-price" type="number" inputmode="decimal" placeholder="0.00" min="0" step="0.01"></div></div>
                        </div>
                        <div class="form-actions" style="margin-top:4px">
                            <button class="btn btn-primary" onclick="saveIngredient()">Save</button>
                            <button class="btn btn-secondary" onclick="closeIngForm()">Cancel</button>
                            <button class="btn-danger form-delete" id="ing-delete-btn" onclick="deleteIngredient()">Delete Ingredient</button>
                        </div>
                </div>
                <div id="ingList"></div>
            </div>
            
            <!-- SHOPPING LIST -->
            <div id="view-shopping" class="view">
                <div class="view-header"><div class="view-title">Shopping List</div></div>
                <div class="menu-selector">
                    <label>Menu</label>
                    <select id="shop-menu-select" onchange="renderShoppingList()">
                        <option value="">— Select a menu —</option>
                    </select>
                </div>
                <div id="shoppingContent">
                    <div class="empty"><div class="empty-icon">🛒</div><strong>Select a menu to generate a shopping list</strong></div>
                </div>
            </div>

            <!-- HELP -->
            <div id="view-help" class="view">
                <div class="view-header"><div class="view-title">Help</div></div>
                <div id="helpContent"></div>
            </div>

        </main>
        
        <script>
            // ── BOOT FROM CONFIG ──────────────────────────────────
            const cfg = window.VERTICAL_CONFIG;
            if (!cfg) { document.body.innerHTML = '<p style="padding:40px;font-family:sans-serif">Error: config.js not loaded.</p>'; throw new Error('VERTICAL_CONFIG missing'); }
            
            // Apply branding
            document.getElementById('page-title').textContent = cfg.appName;
            document.getElementById('header-logo').innerHTML = cfg.logoHTML;
            document.getElementById('header-tagline').textContent = cfg.tagline;
            
            // Apply color palette
            const root = document.documentElement;
            Object.entries(cfg.colors).forEach(([k, v]) => root.style.setProperty('--' + k, v));
            
            // ── STATE ─────────────────────────────────────────────
            const STORAGE_KEY = cfg.storageKey;
            
            function loadState() {
                try { const s = localStorage.getItem(STORAGE_KEY); if (s) return JSON.parse(s); } catch(e) {}
                return JSON.parse(JSON.stringify(cfg.defaultState));
            }
            let saveWarned = false;
            function saveState() {
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
                catch(e) {
                    if (!saveWarned) { saveWarned = true; alert('Your changes could not be saved in this browser. Tap "Back up" to keep a copy of your data.'); }
                }
            }

            // ── BACKUP / RESTORE ──────────────────────────────────
            function exportData() {
                const backup = { app: cfg.appName, storageKey: STORAGE_KEY, exportedAt: new Date().toISOString(), state: state };
                const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
                const d = new Date();
                const stamp = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = cfg.appName.toLowerCase() + '-backup-' + stamp + '.json';
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            }
            function importData(input) {
                const file = input.files && input.files[0];
                input.value = '';
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => {
                    let data;
                    try { data = JSON.parse(reader.result); } catch(e) { alert('That file isn’t a backup this app can read.'); return; }
                    const s = data && data.state ? data.state : data;
                    if (!s || !Array.isArray(s.ingredients) || !Array.isArray(s.recipes) || !Array.isArray(s.menus)) {
                        alert('That file isn’t a backup this app can read.'); return;
                    }
                    const when = data.exportedAt ? ' from ' + new Date(data.exportedAt).toLocaleString() : '';
                    if (!confirm('Restore the backup' + when + '?\n\n' + s.ingredients.length + ' ingredients, ' + s.recipes.length + ' recipes, ' + s.menus.length + ' menus.\n\nThis replaces everything currently in the app.')) return;
                    const maxId = arr => arr.reduce((m, x) => Math.max(m, Number(x.id) || 0), 0);
                    s.nextIngId = Math.max(s.nextIngId || 0, maxId(s.ingredients) + 1);
                    s.nextRecId = Math.max(s.nextRecId || 0, maxId(s.recipes) + 1);
                    s.nextMenuId = Math.max(s.nextMenuId || 0, maxId(s.menus) + 1);
                    state = s;
                    saveState();
                    showView('menus', document.querySelector('.nav-btn'));
                    alert('Backup restored.');
                };
                reader.readAsText(file);
            }

            // Ask the browser not to clear this site's data on its own (honored by Chrome/Firefox; ignored elsewhere)
            if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }
            function clearAllData() {
                if (!confirm('Reset everything to defaults? Your custom data will be lost.')) return;
                localStorage.removeItem(STORAGE_KEY);
                state = JSON.parse(JSON.stringify(cfg.defaultState));
                saveState(); renderIngredients();
            }
            let state = loadState();
            let currentMenuId = null;
            
            // ── NAV ───────────────────────────────────────────────
            function showView(name, btn) {
                document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                document.getElementById('view-' + name).classList.add('active');
                if (btn) btn.classList.add('active');
                if (name === 'ingredients') closeIngForm();
                if (name === 'recipes') closeRecipeForm();
                if (name === 'menus') showGrid();
                if (name === 'shopping') { populateShoppingSelect(); renderShoppingList(); }
            }
            
            // ── MENU SCREENS ──────────────────────────────────────
            function showGrid() {
                currentMenuId = null;
                document.getElementById('screen-grid').style.display = 'block';
                document.getElementById('screen-detail').style.display = 'none';
                document.getElementById('screen-estimator').style.display = 'none';
                renderMenuGrid();
            }
            function showDetail(menuId) {
                currentMenuId = menuId;
                document.getElementById('screen-grid').style.display = 'none';
                document.getElementById('screen-detail').style.display = 'block';
                document.getElementById('screen-estimator').style.display = 'none';
                renderDetail();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
            function openEstimator() {
                const menu = state.menus.find(m => m.id === currentMenuId);
                if (!menu) return;
                document.getElementById('screen-grid').style.display = 'none';
                document.getElementById('screen-detail').style.display = 'none';
                document.getElementById('screen-estimator').style.display = 'block';
                document.getElementById('estimator-title').textContent = menu.name;
                renderEstimator(menu);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
            function closeEstimator() { showDetail(currentMenuId); }
            
            // ── CARD COLLAPSE ─────────────────────────────────────
            function toggleCard(id) {
                const body = document.getElementById('card-body-' + id);
                const caret = document.getElementById('card-caret-' + id);
                if (!body) return;
                body.classList.toggle('open');
                if (caret) caret.classList.toggle('open');
            }
            
            // ── HELPERS ───────────────────────────────────────────
            function costPerUom(ing) { return ing.price / ing.size; }
            function recipeIdealCost(recipe) {
                return recipe.ingredients.reduce((sum, ri) => {
                    const ing = state.ingredients.find(i => i.id === ri.ingId);
                    return sum + (ing ? costPerUom(ing) * ri.amount : 0);
                }, 0);
            }
            function recipeActualCostPerUnit(recipe, qty) {
                if (!qty || qty <= 0) return 0;
                let total = 0;
                recipe.ingredients.forEach(ri => {
                    const ing = state.ingredients.find(i => i.id === ri.ingId);
                    if (!ing) return;
                    total += Math.ceil((ri.amount * qty) / ing.size) * ing.price;
                });
                return total / qty;
            }
            function menuTrueCost(menu) {
                return menu.recipes.reduce((sum, item) => {
                    const rec = state.recipes.find(r => r.id === item.recipeId);
                    return sum + (rec ? recipeActualCostPerUnit(rec, item.qty) * item.qty : 0);
                }, 0);
            }
            function menuTotalBatches(menu) { return menu.recipes.reduce((s, i) => s + i.qty, 0); }
            function calcIngUsage(menu) {
                const ingUsage = {};
                menu.recipes.forEach(item => {
                    const rec = state.recipes.find(r => r.id === item.recipeId);
                    if (!rec) return;
                    rec.ingredients.forEach(ri => {
                        const ing = state.ingredients.find(i => i.id === ri.ingId);
                        if (!ing) return;
                        if (!ingUsage[ri.ingId]) ingUsage[ri.ingId] = { ing, consumed: 0, cost: 0 };
                        ingUsage[ri.ingId].consumed += ri.amount * item.qty;
                        ingUsage[ri.ingId].cost += costPerUom(ing) * ri.amount * item.qty;
                    });
                });
                Object.values(ingUsage).forEach(u => {
                    u.unitsOpened = Math.ceil(u.consumed / u.ing.size);
                    u.unitsCost = u.unitsOpened * u.ing.price;
                });
                return ingUsage;
            }
            function sweetSpotHint(recipe, currentQty) {
                if (!currentQty || currentQty <= 0) return '';
                const currentCost = recipeActualCostPerUnit(recipe, currentQty);
                if (currentCost === 0) return '';
                const scanTo = currentQty * 3;
                let bestQty = null, bestCost = currentCost;
                for (let q = currentQty + 1; q <= scanTo; q++) {
                    const c = recipeActualCostPerUnit(recipe, q);
                    if (c < bestCost) { bestCost = c; bestQty = q; break; }
                }
                if (!bestQty || (currentCost - bestCost) / currentCost < 0.10) {
                    if (currentQty === 1) return `<div class="sweet-spot optimal">\u2713 Good quantity</div>`;
                    const prevCost = recipeActualCostPerUnit(recipe, currentQty - 1);
                    if (prevCost > currentCost) return `<div class="sweet-spot optimal">\u2713 You're at a good quantity</div>`;
                    return '';
                }
                return `<div class="sweet-spot hint">\u2193 Make ${bestQty} batches instead and save $${(currentCost - bestCost).toFixed(2)}/batch</div>`;
            }
            function ingOptsHTML(selectedId) {
                return `<option value="" disabled ${selectedId ? '' : 'selected'}>— Select an ingredient —</option>` +
                    state.ingredients.map(i => `<option value="${i.id}" ${i.id === selectedId ? 'selected' : ''}>${i.name}</option>`).join('');
            }
            function recipeOptsHTML(selectedId) {
                return `<option value="" disabled ${selectedId ? '' : 'selected'}>— Select a recipe —</option>` +
                    state.recipes.map(r => `<option value="${r.id}" ${r.id === selectedId ? 'selected' : ''}>${r.name}</option>`).join('');
            }
            // Shows a form "screen" in a tab: hides the tab's header and list while the form is open
            function setFormMode(viewId, formId, listId, open) {
                document.querySelector('#' + viewId + ' .view-header').style.display = open ? 'none' : '';
                document.getElementById(listId).style.display = open ? 'none' : '';
                document.getElementById(formId).style.display = open ? 'block' : 'none';
                window.scrollTo({ top: 0 });
            }
            
            // ── INGREDIENTS ───────────────────────────────────────
            function openIngForm(id) {
                const ing = id ? state.ingredients.find(i => i.id === id) : null;
                document.getElementById('ingFormTitle').textContent = ing ? 'Edit Ingredient' : 'New Ingredient';
                document.getElementById('ing-edit-id').value = ing ? ing.id : '';
                document.getElementById('ing-name').value = ing ? ing.name : '';
                document.getElementById('ing-uom').value = ing ? ing.uom : '';
                document.getElementById('ing-size').value = ing ? ing.size : '';
                document.getElementById('ing-price').value = ing ? ing.price.toFixed(2) : '';
                document.getElementById('ing-delete-btn').style.display = ing ? '' : 'none';
                setFormMode('view-ingredients', 'ingForm', 'ingList', true);
                if (!ing) document.getElementById('ing-name').focus();
            }
            function closeIngForm() {
                setFormMode('view-ingredients', 'ingForm', 'ingList', false);
                renderIngredients();
            }
            function saveIngredient() {
                const name = document.getElementById('ing-name').value.trim();
                const uom = document.getElementById('ing-uom').value.trim();
                const size = parseFloat(document.getElementById('ing-size').value);
                const price = parseFloat(document.getElementById('ing-price').value);
                if (!name || !uom || isNaN(size) || isNaN(price)) { alert('Please fill in all fields.'); return; }
                const editId = parseInt(document.getElementById('ing-edit-id').value);
                if (editId) {
                    const ing = state.ingredients.find(i => i.id === editId);
                    if (ing) Object.assign(ing, { name, uom, size, price });
                } else {
                    state.ingredients.push({ id: state.nextIngId++, name, uom, size, price });
                }
                saveState(); closeIngForm();
            }
            function deleteIngredient() {
                const id = parseInt(document.getElementById('ing-edit-id').value);
                const ing = state.ingredients.find(i => i.id === id);
                if (!ing) return;
                const usedIn = state.recipes.filter(r => r.ingredients.some(ri => ri.ingId === id));
                const msg = usedIn.length
                    ? `Delete "${ing.name}"?\n\nIt's used in ${usedIn.length} recipe${usedIn.length !== 1 ? 's' : ''}: ${usedIn.map(r => r.name).join(', ')}. Deleting it removes it from ${usedIn.length !== 1 ? 'those recipes' : 'that recipe'}.\n\nThis can't be undone.`
                    : `Delete "${ing.name}"?\n\nThis can't be undone.`;
                if (!confirm(msg)) return;
                state.ingredients = state.ingredients.filter(i => i.id !== id);
                usedIn.forEach(r => { r.ingredients = r.ingredients.filter(ri => ri.ingId !== id); });
                saveState(); closeIngForm();
            }
            function renderIngredients() {
                const el = document.getElementById('ingList');
                if (!state.ingredients.length) {
                    el.innerHTML = `<div class="empty"><div class="empty-icon">${cfg.emptyIcons.ingredients}</div><strong>No ingredients yet</strong></div>`; return;
                }
                el.innerHTML = state.ingredients.map(ing => `
    <div class="card card-clickable" onclick="openIngForm(${ing.id})">
      <div class="card-top">
        <div class="card-info">
          <div class="card-title">${ing.name}</div>
          <div class="card-sub">${ing.size} ${ing.uom}s / pkg &nbsp;·&nbsp; $${ing.price.toFixed(2)} / pkg &nbsp;·&nbsp; $${costPerUom(ing).toFixed(3)} / ${ing.uom}</div>
        </div>
        <div class="card-chevron">›</div>
      </div>
    </div>`).join('');
            }
            
            // ── RECIPES ───────────────────────────────────────────
            function openRecipeForm(id) {
                const rec = id ? state.recipes.find(r => r.id === id) : null;
                document.getElementById('recFormTitle').textContent = rec ? 'Edit Recipe' : 'New Recipe';
                document.getElementById('rec-edit-id').value = rec ? rec.id : '';
                document.getElementById('rec-name').value = rec ? rec.name : '';
                document.getElementById('rec-desc').value = rec ? (rec.desc || '') : '';
                document.getElementById('rec-delete-btn').style.display = rec ? '' : 'none';
                const container = document.getElementById('recIngRows');
                container.innerHTML = '';
                if (rec && rec.ingredients.length) { rec.ingredients.forEach(ri => addIngRow(ri.ingId, ri.amount)); }
                else { addIngRow(); }
                setFormMode('view-recipes', 'recipeForm', 'recipeList', true);
                if (!rec) document.getElementById('rec-name').focus();
            }
            function closeRecipeForm() {
                setFormMode('view-recipes', 'recipeForm', 'recipeList', false);
                renderRecipes();
            }
            function updateIngRowUnit(select) {
                const ing = state.ingredients.find(i => i.id === parseInt(select.value));
                select.classList.toggle('placeholder', !ing);
                select.parentElement.querySelector('.ing-uom-label').textContent = ing ? ing.uom : '';
            }
            function addIngRow(selectedIngId, amount) {
                const container = document.getElementById('recIngRows');
                const row = document.createElement('div');
                row.className = 'ing-row rec-ing-row';
                row.innerHTML = `
    <select onchange="updateIngRowUnit(this)">${ingOptsHTML(selectedIngId)}</select>
    <input type="number" placeholder="Amount" min="0" step="any" inputmode="decimal" value="${amount !== undefined ? amount : ''}">
    <span class="ing-uom-label"></span>
    <button class="btn-danger" style="padding:4px 8px;flex-shrink:0" onclick="this.parentElement.remove()">✕</button>`;
                container.appendChild(row);
                updateIngRowUnit(row.querySelector('select'));
            }
            function saveRecipe() {
                const name = document.getElementById('rec-name').value.trim();
                const desc = document.getElementById('rec-desc').value.trim();
                if (!name) { alert('Recipe name is required.'); return; }
                const rows = document.querySelectorAll('#recIngRows .ing-row');
                const ingredients = [];
                rows.forEach(row => {
                    const ingId = parseInt(row.querySelector('select').value);
                    const amount = parseFloat(row.querySelector('input').value);
                    if (ingId && !isNaN(amount) && amount > 0) ingredients.push({ ingId, amount });
                });
                const editId = parseInt(document.getElementById('rec-edit-id').value);
                if (editId) {
                    const rec = state.recipes.find(r => r.id === editId);
                    if (rec) Object.assign(rec, { name, desc, ingredients });
                } else {
                    state.recipes.push({ id: state.nextRecId++, name, desc, ingredients });
                }
                saveState(); closeRecipeForm();
            }
            function deleteRecipe() {
                const id = parseInt(document.getElementById('rec-edit-id').value);
                const rec = state.recipes.find(r => r.id === id);
                if (!rec) return;
                const usedIn = state.menus.filter(m => m.recipes.some(item => item.recipeId === id));
                const msg = usedIn.length
                    ? `Delete "${rec.name}"?\n\nIt's used in ${usedIn.length} menu${usedIn.length !== 1 ? 's' : ''}: ${usedIn.map(m => m.name).join(', ')}. Deleting it removes it from ${usedIn.length !== 1 ? 'those menus' : 'that menu'}.\n\nThis can't be undone.`
                    : `Delete "${rec.name}"?\n\nThis can't be undone.`;
                if (!confirm(msg)) return;
                state.recipes = state.recipes.filter(r => r.id !== id);
                usedIn.forEach(m => { m.recipes = m.recipes.filter(item => item.recipeId !== id); });
                saveState(); closeRecipeForm();
            }
            function renderRecipes() {
                const el = document.getElementById('recipeList');
                if (!state.recipes.length) {
                    el.innerHTML = `<div class="empty"><div class="empty-icon">${cfg.emptyIcons.recipes}</div><strong>No recipes yet</strong></div>`; return;
                }
                el.innerHTML = state.recipes.map(rec => {
                    const cost = recipeIdealCost(rec);
                    return `
    <div class="card card-clickable" onclick="openRecipeForm(${rec.id})">
      <div class="card-top">
        <div class="card-info">
          <div class="card-title">${rec.name}</div>
          <div class="card-sub">$${cost.toFixed(2)} / batch &nbsp;·&nbsp; ${rec.ingredients.length} ingredient${rec.ingredients.length !== 1 ? 's' : ''}</div>
        </div>
        <div class="card-chevron">›</div>
      </div>
    </div>`;
                }).join('');
            }
            
            // ── MENU GRID ─────────────────────────────────────────
            function showNewMenuForm() {
                document.getElementById('newMenuForm').style.display = 'block';
                document.getElementById('new-menu-name').value = '';
                document.getElementById('newMenuRecipeRows').innerHTML = '';
                addNewMenuRecipeRow();
                document.getElementById('new-menu-name').focus();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
            function hideNewMenuForm() { document.getElementById('newMenuForm').style.display = 'none'; }
            function menuRecipeRowHTML(selectedRecipeId) {
                return `
    <select style="flex:3;min-width:0" class="${selectedRecipeId ? '' : 'placeholder'}" onchange="this.classList.remove('placeholder')">${recipeOptsHTML(selectedRecipeId)}</select>
    <button class="btn-danger" style="padding:4px 8px;flex-shrink:0" onclick="this.parentElement.remove()">✕</button>`;
            }
            function addNewMenuRecipeRow() {
                const container = document.getElementById('newMenuRecipeRows');
                const row = document.createElement('div');
                row.className = 'ing-row';
                row.innerHTML = menuRecipeRowHTML();
                container.appendChild(row);
            }
            function saveNewMenu() {
                const name = document.getElementById('new-menu-name').value.trim();
                if (!name) { alert('Menu name is required.'); return; }
                const rows = document.querySelectorAll('#newMenuRecipeRows .ing-row');
                const recipeIds = [];
                rows.forEach(row => {
                    const recipeId = parseInt(row.querySelector('select').value);
                    if (recipeId) recipeIds.push(recipeId);
                });
                state.menus.push({ id: state.nextMenuId++, name, recipes: recipeIds.map(recipeId => ({ recipeId, qty: 1 })) });
                saveState(); hideNewMenuForm(); renderMenuGrid();
            }
            function renderMenuGrid() {
                const el = document.getElementById('menuGrid');
                if (!state.menus.length) {
                    el.innerHTML = `<div class="empty"><div class="empty-icon">${cfg.emptyIcons.menus}</div><strong>No menus yet</strong><p>Create your first menu to start estimating.</p></div>`; return;
                }
                el.innerHTML = `<div class="menu-grid">${state.menus.map(menu => {
      const trueCost = menuTrueCost(menu);
      const totalBatches = menuTotalBatches(menu);
      const avgCost = totalBatches > 0 ? trueCost / totalBatches : 0;
      const recipeNames = menu.recipes.map(item => {
      const rec = state.recipes.find(r => r.id === item.recipeId);
      return rec ? `${rec.name} \u00D7${item.qty}` : '';
    }).filter(Boolean).join(', ');
    return `
    <div class="menu-tile" onclick="showDetail(${menu.id})">
    <div class="menu-tile-top">
    <div class="menu-tile-name">${menu.name}</div>
    <div class="menu-tile-arrow">›</div>
    </div>
    <div class="menu-tile-stats">
    <div class="menu-stat"><div class="menu-stat-val">${totalBatches}</div><div class="menu-stat-lbl">Total Batches</div></div>
    <div class="menu-stat"><div class="menu-stat-val">$${trueCost.toFixed(2)}</div><div class="menu-stat-lbl">Purchase Cost</div></div>
    <div class="menu-stat"><div class="menu-stat-val">$${avgCost.toFixed(2)}</div><div class="menu-stat-lbl">Avg / Batch</div></div>
    <div class="menu-stat"><div class="menu-stat-val">${menu.recipes.length}</div><div class="menu-stat-lbl">Recipes</div></div>
    </div>
    <div class="menu-tile-recipes">${recipeNames}</div>
    </div>`;
  }).join('')}</div>`;
            }
            
            // ── MENU DETAIL ───────────────────────────────────────
            function renderDetail() {
                const menu = state.menus.find(m => m.id === currentMenuId);
                if (!menu) return;
                document.getElementById('detail-title').textContent = menu.name;
                document.getElementById('detail-menu-name').value = menu.name;
                renderDetailStats(menu);
                const list = document.getElementById('detail-recipe-list');
                const rows = menu.recipes.map(item => {
                    const rec = state.recipes.find(r => r.id === item.recipeId);
                    if (!rec) return '';
                    return `<div class="menu-rec-row">
      <span class="menu-rec-name">${rec.name}</span>
      <input class="qty-input" type="number" min="0" inputmode="numeric" value="${item.qty}" oninput="setMenuQty(${rec.id}, this.value)">
      <span class="menu-rec-cost" id="mr-cost-${rec.id}">$${recipeActualCostPerUnit(rec, item.qty).toFixed(2)}</span>
      <button class="btn-danger" style="padding:4px 8px" title="Remove from menu" onclick="removeMenuRecipe(${rec.id})">✕</button>
    </div>`;
                }).join('');
                list.innerHTML = rows || '<div class="menu-empty">No recipes in this menu yet.</div>';
            }
            function renderDetailStats(menu) {
                const trueCost = menuTrueCost(menu);
                const totalBatches = menuTotalBatches(menu);
                const avgCost = totalBatches > 0 ? trueCost / totalBatches : 0;
                document.getElementById('detail-stats').innerHTML = `
    <div class="detail-stat"><div class="detail-stat-val">${totalBatches}</div><div class="detail-stat-lbl">Total Batches</div></div>
    <div class="detail-stat"><div class="detail-stat-val">$${trueCost.toFixed(2)}</div><div class="detail-stat-lbl">Purchase Cost</div></div>
    <div class="detail-stat"><div class="detail-stat-val">$${avgCost.toFixed(2)}</div><div class="detail-stat-lbl">Avg / Batch</div></div>
    <div class="detail-stat"><div class="detail-stat-val">${menu.recipes.length}</div><div class="detail-stat-lbl">Recipes</div></div>`;
            }
            function renameCurrentMenu(input) {
                const menu = state.menus.find(m => m.id === currentMenuId);
                if (!menu) return;
                const name = input.value.trim();
                if (!name) { input.value = menu.name; return; }
                menu.name = name;
                saveState();
                document.getElementById('detail-title').textContent = name;
            }
            function setMenuQty(recipeId, val) {
                const menu = state.menus.find(m => m.id === currentMenuId);
                if (!menu) return;
                const item = menu.recipes.find(r => r.recipeId === recipeId);
                const rec = state.recipes.find(r => r.id === recipeId);
                if (!item || !rec) return;
                item.qty = Math.max(0, parseInt(val) || 0);
                saveState();
                document.getElementById('mr-cost-' + recipeId).textContent = '$' + recipeActualCostPerUnit(rec, item.qty).toFixed(2);
                renderDetailStats(menu);
            }
            function removeMenuRecipe(recipeId) {
                const menu = state.menus.find(m => m.id === currentMenuId);
                if (!menu) return;
                menu.recipes = menu.recipes.filter(r => r.recipeId !== recipeId);
                saveState(); renderDetail();
            }
            function addMenuRecipePicker() {
                const menu = state.menus.find(m => m.id === currentMenuId);
                if (!menu) return;
                const list = document.getElementById('detail-recipe-list');
                if (list.querySelector('select.menu-rec-picker')) { list.querySelector('select.menu-rec-picker').focus(); return; }
                const available = state.recipes.filter(r => !menu.recipes.some(item => item.recipeId === r.id));
                if (!available.length) { alert(state.recipes.length ? 'Every recipe is already in this menu.' : 'Add a recipe on the Recipes tab first.'); return; }
                const empty = list.querySelector('.menu-empty');
                if (empty) empty.remove();
                const row = document.createElement('div');
                row.className = 'menu-rec-row';
                row.innerHTML = `
      <select class="menu-rec-picker placeholder" onchange="addRecipeToMenu(parseInt(this.value))">
        <option value="" disabled selected>— Select a recipe —</option>
        ${available.map(r => `<option value="${r.id}">${r.name}</option>`).join('')}
      </select>
      <button class="btn-danger" style="padding:4px 8px" title="Cancel" onclick="renderDetail()">✕</button>`;
                list.appendChild(row);
                row.querySelector('select').focus();
            }
            function addRecipeToMenu(recipeId) {
                const menu = state.menus.find(m => m.id === currentMenuId);
                if (!menu || !recipeId) return;
                menu.recipes.push({ recipeId, qty: 1 });
                saveState(); renderDetail();
            }
            function deleteCurrentMenu() {
                const menu = state.menus.find(m => m.id === currentMenuId);
                if (!menu) return;
                if (!confirm(`Delete "${menu.name}"?`)) return;
                state.menus = state.menus.filter(m => m.id !== currentMenuId);
                saveState(); showGrid();
            }
            
            // ── ESTIMATOR ─────────────────────────────────────────
            function setText(id, val, extraClass) {
                const el = document.getElementById(id);
                if (!el) return;
                el.textContent = val;
                el.className = 'num' + (extraClass ? ' ' + extraClass : '');
            }
            function updateQty(menuId, recipeId, val) {
                const menu = state.menus.find(m => m.id === menuId);
                if (!menu) return;
                const item = menu.recipes.find(r => r.recipeId === recipeId);
                if (item) item.qty = Math.max(0, parseInt(val) || 0);
                saveState(); refreshEstimator(menu);
            }
            function refreshEstimator(menu) {
                const ingUsage = calcIngUsage(menu);
                const totalIngCost = Object.values(ingUsage).reduce((s, u) => s + u.cost, 0);
                const totalUnitCost = Object.values(ingUsage).reduce((s, u) => s + u.unitsCost, 0);
                const totalUnits = menu.recipes.reduce((s, i) => s + i.qty, 0);
                setText('summ-total-units', totalUnits);
                setText('summ-ing-cost', '$' + totalIngCost.toFixed(2));
                setText('summ-unit-cost', '$' + totalUnitCost.toFixed(2));
                setText('summ-avg', totalUnits ? '$' + (totalUnitCost / totalUnits).toFixed(2) : '—');
                menu.recipes.forEach(item => {
                    const rec = state.recipes.find(r => r.id === item.recipeId);
                    if (!rec) return;
                    const ideal = recipeIdealCost(rec);
                    const actual = recipeActualCostPerUnit(rec, item.qty);
                    setText(`est-actual-${item.recipeId}`, '$' + actual.toFixed(2), actual < ideal ? 'cost-better' : '');
                    setText(`est-total-${item.recipeId}`, '$' + (actual * item.qty).toFixed(2));
                    const hintEl = document.getElementById(`est-hint-${item.recipeId}`);
                    if (hintEl) hintEl.innerHTML = sweetSpotHint(rec, item.qty);
                });
                const tbody = document.getElementById('ing-breakdown-body');
                const tfoot = document.getElementById('ing-breakdown-foot');
                if (tbody) tbody.innerHTML = Object.values(ingUsage).map(u => `
    <tr>
      <td>${u.ing.name}</td>
      <td class="num">${u.consumed.toFixed(2)} ${u.ing.uom}s</td>
      <td class="num">${u.unitsOpened}</td>
      <td class="num">$${u.cost.toFixed(2)}</td>
      <td class="num">$${u.unitsCost.toFixed(2)}</td>
    </tr>`).join('');
    if (tfoot) tfoot.innerHTML = `<tr><td>Total</td><td></td><td></td><td class="num">$${totalIngCost.toFixed(2)}</td><td class="num">$${totalUnitCost.toFixed(2)}</td></tr>`;
    const recFoot = document.getElementById('rec-breakdown-foot');
    if (recFoot) recFoot.innerHTML = `<tr><td>Total</td><td></td><td></td><td></td><td class="num">$${totalUnitCost.toFixed(2)}</td></tr>`;
            }
            function renderEstimator(menu) {
                const ingUsage = calcIngUsage(menu);
                const totalIngCost = Object.values(ingUsage).reduce((s, u) => s + u.cost, 0);
                const totalUnitCost = Object.values(ingUsage).reduce((s, u) => s + u.unitsCost, 0);
                const totalUnits = menu.recipes.reduce((s, i) => s + i.qty, 0);
                const recipeRows = menu.recipes.map(item => {
                    const rec = state.recipes.find(r => r.id === item.recipeId);
                    if (!rec) return '';
                    const ideal = recipeIdealCost(rec);
                    const actual = recipeActualCostPerUnit(rec, item.qty);
                    return `<tr>
      <td>
        <div>${rec.name}</div>
        <div id="est-hint-${rec.id}">${sweetSpotHint(rec, item.qty)}</div>
      </td>
      <td class="num">$${ideal.toFixed(2)}</td>
      <td class="num"><input class="qty-input" type="number" min="0" value="${item.qty}" oninput="updateQty(${menu.id}, ${rec.id}, this.value)"></td>
      <td class="num ${actual < ideal ? 'cost-better' : ''}" id="est-actual-${rec.id}">$${actual.toFixed(2)}</td>
      <td class="num" id="est-total-${rec.id}">$${(actual * item.qty).toFixed(2)}</td>
    </tr>`;
                }).join('');
                const ingRows = Object.values(ingUsage).map(u => `
    <tr>
      <td>${u.ing.name}</td>
      <td class="num">${u.consumed.toFixed(2)} ${u.ing.uom}s</td>
      <td class="num">${u.unitsOpened}</td>
      <td class="num">$${u.cost.toFixed(2)}</td>
      <td class="num">$${u.unitsCost.toFixed(2)}</td>
    </tr>`).join('');
    document.getElementById('estimatorContent').innerHTML = `
    <div class="summary-grid">
      <div class="summary-box"><div class="val" id="summ-total-units">${totalUnits}</div><div class="lbl">Total Batches</div></div>
      <div class="summary-box"><div class="val" id="summ-ing-cost">$${totalIngCost.toFixed(2)}</div><div class="lbl">Usage Cost</div></div>
      <div class="summary-box"><div class="val" id="summ-unit-cost">$${totalUnitCost.toFixed(2)}</div><div class="lbl">Purchase Cost</div></div>
      <div class="summary-box"><div class="val" id="summ-avg">${totalUnits ? '$' + (totalUnitCost / totalUnits).toFixed(2) : '—'}</div><div class="lbl">Avg / Batch</div></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div style="padding:12px 10px"><span class="section-label">By Recipe</span> <span style="font-size:0.75rem;color:var(--text-muted);margin-left:8px">Edit batches — purchase cost updates as you cross package boundaries</span></div>
      <div class="table-scroll"><table class="est-table">
        <thead><tr><th>Recipe</th><th style="text-align:right">Usage Cost</th><th style="text-align:right">Batches</th><th style="text-align:right">Purchase Cost/Batch</th><th style="text-align:right">Total</th></tr></thead>
        <tbody>${recipeRows}</tbody>
        <tfoot id="rec-breakdown-foot"><tr><td>Total</td><td></td><td></td><td></td><td class="num">$${totalUnitCost.toFixed(2)}</td></tr></tfoot>
      </table></div>
    </div>
    <div class="card">
      <div style="padding:12px 10px"><span class="section-label">By Ingredient</span></div>
      <div class="table-scroll"><table class="est-table">
        <thead><tr><th>Ingredient</th><th style="text-align:right">Consumed</th><th style="text-align:right">Pkgs Opened</th><th style="text-align:right">Usage $</th><th style="text-align:right">Purchase $</th></tr></thead>
        <tbody id="ing-breakdown-body">${ingRows}</tbody>
        <tfoot id="ing-breakdown-foot"><tr><td>Total</td><td></td><td></td><td class="num">$${totalIngCost.toFixed(2)}</td><td class="num">$${totalUnitCost.toFixed(2)}</td></tr></tfoot>
      </table></div>
    </div>`;
            }
            
            // ── SHOPPING LIST ─────────────────────────────────────
            function populateShoppingSelect() {
                const sel = document.getElementById('shop-menu-select');
                const cur = sel.value;
                sel.innerHTML = '<option value="">— Select a menu —</option>';
                state.menus.forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = m.id; opt.textContent = m.name;
                    sel.appendChild(opt);
                });
                if (cur) sel.value = cur;
            }
            function renderShoppingList() {
                const menuId = parseInt(document.getElementById('shop-menu-select').value);
                const el = document.getElementById('shoppingContent');
                if (!menuId) { el.innerHTML = `<div class="empty"><div class="empty-icon">🛒</div><strong>Select a menu</strong></div>`; return; }
                const menu = state.menus.find(m => m.id === menuId);
                if (!menu) return;
                const ingUsage = calcIngUsage(menu);
                const items = Object.values(ingUsage).map(u => ({
                    name: u.ing.name, pkgsNeeded: u.unitsOpened,
                    uom: u.ing.uom, size: u.ing.size, price: u.ing.price,
                    totalCost: u.unitsOpened * u.ing.price,
                })).sort((a, b) => a.name.localeCompare(b.name));
                const totalCost = items.reduce((s, i) => s + i.totalCost, 0);
                el.innerHTML = `
      <div class="card" style="padding:14px 16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div class="section-label">${items.length} items to buy</div>
        <div style="font-family:var(--mono);font-size:0.88rem;font-weight:600;color:var(--accent)">Est. $${totalCost.toFixed(2)}</div>
      </div>
      ${items.map(i => `
      <div class="shop-item">
      <div>
      <div style="font-weight:500">${i.name}</div>
      <div style="font-size:0.75rem;color:var(--text-muted)">${i.pkgsNeeded} pkg${i.pkgsNeeded !== 1 ? 's' : ''} \u00D7 ${i.size} ${i.uom}s @ $${i.price.toFixed(2)} ea</div>
      </div>
      <div class="shop-qty">$${i.totalCost.toFixed(2)}</div>
      </div>`).join('')}
    </div>`;
            }
            
            // ── HELP ──────────────────────────────────────────────
            function renderHelp() {
                const h = cfg.help || {};
                const app = cfg.appName;
                const ie = h.ingExample || { pkg: 'a 16 oz package of an ingredient', uom: 'oz', size: 16, price: 8.00 };
                const ce = h.costExample || { name: 'an ingredient', uom: 'oz', amount: 2, size: 16, price: 8.00 };
                const money = n => '$' + n.toFixed(2);
                const recipeCost = ce.amount / ce.size * ce.price;
                const fullBatches = Math.round(ce.size / ce.amount);
                const preloaded = (cfg.defaultState.ingredients || []).length;
                const event = h.event || 'an upcoming market or event';
                document.getElementById('helpContent').innerHTML = `
    <div class="help-card">
      <h2>What ${app} does</h2>
      <p>${app} answers one question: <strong>What do I need to make this, and what will it cost me?</strong> Tell it what your ingredients cost and what goes into your recipes, then plan what you're making for ${event}. It works out what you'll spend and what to buy.</p>
    </div>

    <div class="help-card">
      <h2>Getting started</h2>
      <ol>
        <li><strong>Ingredients:</strong> check the prices and package sizes of what you buy.</li>
        <li><strong>Recipes:</strong> add your recipes and how much of each ingredient one batch uses.</li>
        <li><strong>Menus:</strong> make a menu for an event, with how many batches of each recipe you'll make.</li>
        <li><strong>Estimator and Shopping List:</strong> see what it will cost and what to buy.</li>
      </ol>
    </div>

    <div class="help-card">
      <h2>Ingredients</h2>
      <p>Each ingredient has four fields:</p>
      <ul>
        <li><strong>Name</strong>: what it is.</li>
        <li><strong>Unit of Measure</strong>: the unit you measure it in when you make a recipe (cup, tbsp, oz…).</li>
        <li><strong>Package Size</strong>: how many of those units come in the package you buy.</li>
        <li><strong>Package Price</strong>: what you pay for one package.</li>
      </ul>
      <div class="help-example">Example: ${ie.pkg}<br>Unit: ${ie.uom} &nbsp;·&nbsp; Package Size: ${ie.size} &nbsp;·&nbsp; Package Price: ${ie.price.toFixed(2)}</div>
      <p class="help-tip">Tip: pick the unit your recipes use. Recipe amounts are entered in each ingredient's unit, so if your recipes say cups, use cups here.</p>
      ${preloaded ? `<p class="help-tip">${app} comes with ${preloaded} common ingredients already filled in${h.priceNote ? ' ' + h.priceNote : ''}. Tap <strong>Edit</strong> on any of them to change the price to what you actually pay.</p>` : ''}
    </div>

    <div class="help-card">
      <h2>Recipes</h2>
      <p>Tap <strong>+ Add Recipe</strong>, give it a name, then use <strong>+ Add</strong> to list its ingredients.</p>
      <ul>
        <li>Amounts are for <strong>one batch</strong>.</li>
        <li>Each amount is in that ingredient's unit (shown next to its name).</li>
      </ul>
      <p>The cost shown on a recipe is its <strong>Usage Cost</strong>. See the Estimator section below for what that means.</p>
    </div>

    <div class="help-card">
      <h2>Menus</h2>
      <p>A menu is your plan for one event, like ${event}. Tap <strong>+ New Menu</strong>, name it and add the recipes you're making.</p>
      <p>Tap a menu to see its recipes, with the number of batches and the purchase cost per batch for each. You can change the batches, add a recipe with <strong>+ Add Recipe</strong>, remove one with <strong>✕</strong> or rename the menu. Changes save as you go. From there you can also <strong>Open Estimator</strong> or <strong>Delete</strong> the menu.</p>
    </div>

    <div class="help-card">
      <h2>The Estimator</h2>
      <p>This is where you find out what your menu really costs. Every recipe gets two costs, and the difference between them matters:</p>
      <div class="help-compare">
        <div><h3>Usage Cost</h3><p>Only what goes into the recipe, as if you could buy exactly that much.</p><p class="help-tip">Stays the same no matter how many batches you make.</p></div>
        <div><h3>Purchase Cost</h3><p>What you actually pay at the store, because you have to buy whole packages.</p><p class="help-tip">Use this one to plan your spending. Per batch, it drops as you make more batches.</p></div>
      </div>
      <div class="help-example">Example: ${ce.name}<br>One batch uses ${ce.amount} ${ce.uom}. A package is ${ce.size} ${ce.uom} for ${money(ce.price)}.<br>Usage Cost: ${ce.amount} ÷ ${ce.size} × ${money(ce.price)} = <strong>${money(recipeCost)}</strong> per batch<br>Purchase Cost for 1 batch: you have to buy the whole package, so <strong>${money(ce.price)}</strong><br>Purchase Cost for ${fullBatches} batches: they use up exactly one package, so <strong>${money(ce.price / fullBatches)}</strong> per batch</div>
      <p><strong>The difference is your leftovers.</strong> Purchase Cost minus Usage Cost is the value of the ingredients left over in packages you opened. They aren't wasted, but you've paid for them now.</p>
      <p>Change the number in the <strong>Batches</strong> column and everything updates right away.</p>
      <p><strong>Sweet spot hints.</strong> Sometimes making a few more batches lowers your cost per batch, because you use up packages you're already buying. When that saves enough to matter, you'll see a hint under the recipe like <em>"↓ Make 4 batches instead and save $0.85/batch."</em> A <em>"✓ Good quantity"</em> hint means you're already in a good spot.</p>
      <p>The <strong>By Ingredient</strong> table shows how much of each ingredient the whole menu uses and how many packages you'll open.</p>
    </div>

    <div class="help-card">
      <h2>Shopping List</h2>
      <p>Pick a menu to see how many packages of each ingredient to buy and the estimated total. It uses the batch numbers you set in the Estimator.</p>
    </div>

    <div class="help-card">
      <h2>Keeping your data safe</h2>
      <p>Your data saves automatically, but <strong>only in this browser on this device</strong>. Nothing is stored online.</p>
      <ul>
        <li><strong>Back up</strong> (top of the screen) saves a file with all your ingredients, recipes and menus. Do this regularly and keep the file somewhere safe, like your email.</li>
        <li><strong>Restore</strong> loads a backup file. It replaces everything currently in ${app}.</li>
        <li><strong>Reset to defaults</strong> erases your data and puts the sample data back.</li>
      </ul>
      <p class="help-tip">On an iPhone or iPad, add ${app} to your home screen (Share → Add to Home Screen) and open it from there. Otherwise Safari may clear your data if you don't open ${app} for a while.</p>
      <p class="help-tip">Clearing your browser history, or switching to another device or browser, means starting over from a backup.</p>
    </div>`;
            }

            // ── INIT ──────────────────────────────────────────────
            renderHelp();
            showGrid();
        </script>
    </body>
</html>
